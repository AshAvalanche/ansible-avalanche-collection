---
# Variables automatically applied to all nodes in the [lxd_nodes] group.
# Each node must have lxd_host_name set to the inventory name of its LXD host.
#
# Connection (ansible_host, ansible_port, ansible_user) is handled by the
# inventory — either generated by Terraform (direct SSH to a unique host port)
# or set manually with ProxyJump for non-Terraform setups.

# Announce the LXD host's public IP to AvalancheGo peers.
# Peers connect to <lxd_host_ip>:<staking_port> which is forwarded to the container.
avalanchego_public_ip: "{{ hostvars[lxd_host_name]['ansible_host'] }}"

# AvalancheGo must bind to all interfaces so LXD proxy devices can forward traffic.
avalanchego_http_host: "0.0.0.0"
