---
- name: Set bootstrap_ips variable
  set_fact:
    bootstrap_ips: |
      {{ (bootstrap_ips | default([]))
         + [(hostvars[item]['avalanchego_public_ip'] | default(hostvars[item]['ansible_host']))
           + ':' + (hostvars[item]['avalanchego_staking_port'] | default(avalanchego_staking_port) | string)] }}
  when: avalanchego_network_id not in ['mainnet', 'testnet', 'fuji']
  loop: "{{ groups['bootstrap_nodes'] }}"

- name: Construct bootstrap-* conf
  set_fact:
    node_conf_bootstrap: |
      {{ {
           'bootstrap-ips': '' if inventory_hostname in groups['bootstrap_nodes']
             else (bootstrap_ips | join(',')),
           'bootstrap-ids': '' if inventory_hostname in groups['bootstrap_nodes']
             else (avalanchego_bootstrap_node_ids | join(','))
         } if avalanchego_network_id not in ['mainnet', 'testnet', 'fuji'] else {} }}

- name: Construct genesis-file conf
  set_fact:
    node_conf_genesis_file: |
      {{ {
           'genesis-file': avalanchego_conf_dir + '/genesis.json'
         } if avalanchego_custom_genesis else {} }}

- name: Construct staking-tls-*-file conf
  set_fact:
    node_conf_staking_tls_files: |
      {{ {
           'staking-tls-cert-file': avalanchego_staking_dir + '/staker.crt',
           'staking-tls-key-file': avalanchego_staking_dir + '/staker.key'
         } if avalanchego_staking_use_local_certs else {} }}

- name: Construct staking-signer-key-file conf
  set_fact:
    node_conf_staking_signer_key_file: |
      {{ {
           'staking-signer-key-file': avalanchego_staking_dir + '/signer.key'
         } if avalanchego_staking_use_local_bls_keys else {} }}

- name: Construct http-tls-*-file conf
  set_fact:
    node_conf_http_tls_files: |
      {{ {
           'http-tls-cert-file': avalanchego_https_cert_file,
           'http-tls-key-file': avalanchego_https_key_file
         } if avalanchego_https_enabled else {} }}

- name: Construct node.json conf
  set_fact:
    node_conf_json: |
      {{ (
        node_conf_bootstrap,
        node_conf_genesis_file,
        node_conf_staking_tls_files,
        node_conf_staking_signer_key_file,
        node_conf_http_tls_files
        ) | combine(avalanchego_node_json) }}

- name: Generate node.json
  copy:
    content: "{{ node_conf_json | to_nice_json(indent=2) }}\n"
    dest: "{{ avalanchego_conf_dir }}/node.json"
    owner: "{{ avalanchego_user }}"
    group: "{{ avalanchego_group }}"
    mode: 0400
  notify: Restart avalanchego

- name: Upload genesis.json
  copy:
    src: "{{ avalanchego_custom_genesis_local_file }}"
    dest: "{{ avalanchego_conf_dir }}/genesis.json"
    owner: "{{ avalanchego_user }}"
    group: "{{ avalanchego_group }}"
  when: avalanchego_custom_genesis

# LXD nodes only: check and auto-fetch staking keys so the user never needs a
# manual fetch step. For standard nodes the original strict behavior is preserved
# (task fails if use_local_certs=true but files are missing).
- name: Check if local staking certificate exists on controller
  delegate_to: localhost
  become: false
  stat:
    path: "{{ avalanchego_staking_local_certs_dir }}/{{ inventory_hostname }}.crt"
  register: _local_staking_crt
  when: inventory_hostname in groups.get('lxd_nodes', [])

- name: Check if local BLS key exists on controller
  delegate_to: localhost
  become: false
  stat:
    path: "{{ avalanchego_staking_local_bls_keys_dir }}/{{ inventory_hostname }}.bls.key"
  register: _local_staking_bls
  when: inventory_hostname in groups.get('lxd_nodes', [])

- name: Check if remote staking certificate exists (from a previous AvalancheGo run)
  stat:
    path: "{{ avalanchego_staking_dir }}/staker.crt"
  register: _remote_staking_crt
  when:
    - inventory_hostname in groups.get('lxd_nodes', [])
    - avalanchego_staking_use_local_certs
    - not _local_staking_crt.stat.exists

- name: Check if remote BLS key exists (from a previous AvalancheGo run)
  stat:
    path: "{{ avalanchego_staking_dir }}/signer.key"
  register: _remote_staking_bls
  when:
    - inventory_hostname in groups.get('lxd_nodes', [])
    - avalanchego_staking_use_local_bls_keys
    - not _local_staking_bls.stat.exists

- name: Ensure local staking directories exist on controller
  delegate_to: localhost
  become: false
  file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: "{{ [avalanchego_staking_local_certs_dir, avalanchego_staking_local_bls_keys_dir] | unique }}"
  when:
    - inventory_hostname in groups.get('lxd_nodes', [])
    - >
      (avalanchego_staking_use_local_certs and not _local_staking_crt.stat.exists
       and _remote_staking_crt.stat is defined and _remote_staking_crt.stat.exists)
      or
      (avalanchego_staking_use_local_bls_keys and not _local_staking_bls.stat.exists
       and _remote_staking_bls.stat is defined and _remote_staking_bls.stat.exists)

- name: Fetch staking certificates from remote to controller
  fetch:
    src: "{{ avalanchego_staking_dir }}/staker.{{ item }}"
    dest: "{{ avalanchego_staking_local_certs_dir }}/{{ inventory_hostname }}.{{ item }}"
    flat: true
  loop: ["crt", "key"]
  when:
    - inventory_hostname in groups.get('lxd_nodes', [])
    - avalanchego_staking_use_local_certs
    - not _local_staking_crt.stat.exists
    - _remote_staking_crt.stat is defined
    - _remote_staking_crt.stat.exists

- name: Fetch BLS key from remote to controller
  fetch:
    src: "{{ avalanchego_staking_dir }}/signer.key"
    dest: "{{ avalanchego_staking_local_bls_keys_dir }}/{{ inventory_hostname }}.bls.key"
    flat: true
  when:
    - inventory_hostname in groups.get('lxd_nodes', [])
    - avalanchego_staking_use_local_bls_keys
    - not _local_staking_bls.stat.exists
    - _remote_staking_bls.stat is defined
    - _remote_staking_bls.stat.exists

# For standard nodes: fails if use_local_certs=true but files are missing (original behavior).
# For LXD nodes: skipped on first run (files not yet generated); AvalancheGo creates them
# at startup, and fetch-staking-keys.yml saves them locally for subsequent runs.
- name: Upload node staking certificates
  copy:
    src: "{{ avalanchego_staking_local_certs_dir }}/{{ inventory_hostname }}.{{ item }}"
    dest: "{{ avalanchego_staking_dir }}/staker.{{ item }}"
    owner: "{{ avalanchego_user }}"
    group: "{{ avalanchego_group }}"
    mode: 0400
  loop:
    - crt
    - key
  when:
    - avalanchego_staking_use_local_certs
    - >
      inventory_hostname not in groups.get('lxd_nodes', [])
      or (_local_staking_crt.stat is defined and _local_staking_crt.stat.exists)
      or (_remote_staking_crt.stat is defined and _remote_staking_crt.stat.exists)
  notify: Restart avalanchego

- name: Upload node staking BLS keys
  copy:
    src: "{{ avalanchego_staking_local_bls_keys_dir }}/{{ inventory_hostname }}.bls.key"
    dest: "{{ avalanchego_staking_dir }}/signer.key"
    owner: "{{ avalanchego_user }}"
    group: "{{ avalanchego_group }}"
    mode: 0400
  when:
    - avalanchego_staking_use_local_bls_keys
    - >
      inventory_hostname not in groups.get('lxd_nodes', [])
      or (_local_staking_bls.stat is defined and _local_staking_bls.stat.exists)
      or (_remote_staking_bls.stat is defined and _remote_staking_bls.stat.exists)
  notify: Restart avalanchego

# Handle TLS certificates for HTTPS
- block:
    - name: Upload node HTTPS certificates
      copy:
        src: "{{ avalanchego_https_local_certs_dir }}/{{ inventory_hostname }}.{{ item }}"
        dest: "{{ avalanchego_https_certs_dir }}/{{ inventory_hostname }}.{{ item }}"
        owner: "{{ avalanchego_user }}"
        group: "{{ avalanchego_group }}"
        mode: 0400
      loop:
        - crt
        - key
      when: avalanchego_https_local_certs_dir != ""
      notify: Restart avalanchego

    - name: Upload CA certificate
      copy:
        src: "{{ avalanchego_https_local_certs_dir }}/ca.crt"
        dest: "/usr/local/share/ca-certificates/avalanchego-ca.crt"
        owner: "{{ avalanchego_user }}"
        group: "{{ avalanchego_group }}"
        mode: 0444
      when: avalanchego_https_local_certs_dir != ""
      notify: Restart avalanchego

    - name: Trust CA certificate
      command: update-ca-certificates
      register: update_ca_certificates
      changed_when: "'1 added' in update_ca_certificates.stdout"
      notify: Restart avalanchego
  when: avalanchego_https_enabled

- name: Generate chains aliases.json
  copy:
    content: "{{ avalanchego_chains_aliases | to_nice_json(indent=2) }}\n"
    dest: "{{ avalanchego_chains_conf_dir }}/aliases.json"
    owner: "{{ avalanchego_user }}"
    group: "{{ avalanchego_group }}"
  notify: Restart avalanchego
