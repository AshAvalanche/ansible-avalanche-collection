---
# Fetch staking keys auto-generated by AvalancheGo on first run (LXD nodes only).
# Runs after AvalancheGo has started and written its keys to avalanchego_staking_dir.
# On subsequent runs the local files already exist, so all tasks are skipped.

- name: Ensure local staking directories exist on controller
  delegate_to: localhost
  become: false
  file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: "{{ [avalanchego_staking_local_certs_dir, avalanchego_staking_local_bls_keys_dir] | unique }}"
  when:
    - inventory_hostname in groups.get('lxd_nodes', [])
    - (avalanchego_staking_use_local_certs and not (_local_staking_crt.stat is defined and _local_staking_crt.stat.exists))
      or (avalanchego_staking_use_local_bls_keys and not (_local_staking_bls.stat is defined and _local_staking_bls.stat.exists))

- name: Fetch auto-generated staking certificates to controller
  fetch:
    src: "{{ avalanchego_staking_dir }}/staker.{{ item }}"
    dest: "{{ avalanchego_staking_local_certs_dir }}/{{ inventory_hostname }}.{{ item }}"
    flat: true
  loop: ["crt", "key"]
  when:
    - inventory_hostname in groups.get('lxd_nodes', [])
    - avalanchego_staking_use_local_certs
    - not (_local_staking_crt.stat is defined and _local_staking_crt.stat.exists)

- name: Fetch auto-generated BLS key to controller
  fetch:
    src: "{{ avalanchego_staking_dir }}/signer.key"
    dest: "{{ avalanchego_staking_local_bls_keys_dir }}/{{ inventory_hostname }}.bls.key"
    flat: true
  when:
    - inventory_hostname in groups.get('lxd_nodes', [])
    - avalanchego_staking_use_local_bls_keys
    - not (_local_staking_bls.stat is defined and _local_staking_bls.stat.exists)
