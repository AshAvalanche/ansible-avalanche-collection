---
- name: Validate eRPC inputs
  ansible.builtin.import_tasks: preflight.yml
  tags: [erpc, configure]

- name: Build the eRPC configuration ({{ erpc_config_mode }} mode)
  ansible.builtin.include_tasks: "config-{{ erpc_config_mode }}.yml"
  tags: [erpc, configure]

- name: Deploy eRPC (files, secrets, compose, service)
  ansible.builtin.import_tasks: deploy.yml
  tags: [erpc, configure, install]

- name: Start eRPC
  ansible.builtin.import_tasks: start.yml
  tags: [erpc, start]

- name: Show reachable endpoint(s)
  ansible.builtin.import_tasks: endpoint.yml
  tags: [erpc, start, endpoint]
